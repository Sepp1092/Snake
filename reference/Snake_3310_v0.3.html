<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#263750"><title>Snake 3310 — Retro Edition v0.3</title>
<style>
:root{font-family:Verdana,Geneva,sans-serif;color:#dbe5d7;background:#101b24}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 10%,#31475a,#121c25 60%,#0b1118);display:flex;flex-direction:column;align-items:center}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffdc79;outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-items:center;padding:18px 12px 4px}.toolbar button,.toolbar select{border:1px solid #70808b;background:#253746;color:#edf3e6;border-radius:6px;padding:9px 12px;font-weight:bold;font-size:12px}.toolbar button.active{background:#c9d4a2;color:#203026;border-color:#e5efbb}.wrap{width:100%;display:flex;justify-content:center;align-items:center;flex:1;padding:12px 12px 22px}.phone{position:relative;width:min(375px,94vw);padding:29px 29px 35px;border-radius:65px 65px 77px 77px / 90px 90px 75px 75px;background:linear-gradient(110deg,#1c2c4a,#456284 19%,#263e66 36%,#22385e 62%,#4e6589 84%,#1b2a49);box-shadow:inset 5px 4px 8px #8fa7c066,inset -9px -8px 16px #091324,0 20px 55px #000a,0 2px 3px #000;border:2px solid #121d32;transition:width .2s}.phone:before{content:"";position:absolute;inset:9px;border:2px solid #728ca25c;border-radius:55px 55px 67px 67px / 78px 78px 65px 65px;pointer-events:none}.speaker{width:51px;height:6px;border-radius:15px;background:repeating-linear-gradient(90deg,#0a1622 0 3px,#4f6583 3px 5px);margin:0 auto 12px;box-shadow:0 1px 2px #8495aa}.brand{font-family:Arial,sans-serif;font-weight:900;letter-spacing:3px;font-size:22px;color:#f0f0ed;text-shadow:0 2px 2px #091626;text-align:center;margin-bottom:13px}.face{background:linear-gradient(155deg,#8594a9,#3b5274 32%,#243957 74%,#8a9ab1);border:2px solid #192841;border-radius:25px 25px 31px 31px;padding:18px 14px 20px;box-shadow:inset 0 5px 12px #0b182f,0 3px 4px #9aacc044}.screen-shell{background:#253a41;border-radius:10px;padding:9px;box-shadow:inset 2px 3px 6px #0a1820,1px 2px 2px #a0b6b244}.lcd{position:relative;background:#aabd83;aspect-ratio:1.32 / 1;border:3px solid #536b4f;overflow:hidden;box-shadow:inset 0 0 14px #61784d5e;touch-action:none}.lcd canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}.lcd:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#31472b08 4px);pointer-events:none}.keys{margin-top:15px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;justify-items:stretch}.key{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;min-height:43px;border-radius:49% 49% 42% 42%;border:1px solid #0e1b31;background:linear-gradient(#e1e8ea,#9ca8b2);color:#17243a;font-weight:900;font-size:18px;box-shadow:inset 0 2px 3px white,0 4px 2px #142239;display:flex;align-items:center;justify-content:center}.key.pressed,.key:active{transform:translateY(2px);box-shadow:inset 0 2px 4px #6d7e8b}.key.green{color:#176338}.key.red{color:#962f2c}.key small{font-size:9px;margin-left:3px;color:#55616c}.lcd{cursor:crosshair}.game-version{font-size:10px;letter-spacing:1px;color:#b5c9d6;text-align:center;margin:4px 0 8px}.bottom{color:#d8e1e6;opacity:.85;font-size:11px;line-height:1.55;text-align:center;max-width:650px;margin:0 auto 17px;padding:0 16px}.full .phone{width:min(720px,96vw);padding:0;border:none;border-radius:15px;background:none;box-shadow:none}.full .phone:before,.full .speaker,.full .brand,.full .keys{display:none}.full .face{border-radius:14px;padding:14px;background:#293d3d}.full .lcd{aspect-ratio:1.32/1}.full .screen-shell{padding:12px}.full-controls{display:none;grid-template-columns:repeat(3,65px);justify-content:center;gap:7px;margin-top:16px}.full .full-controls{display:grid}.full-controls .key{border-radius:14px;min-height:52px}.full-controls .up{grid-column:2}.full-controls .left{grid-column:1}.full-controls .down{grid-column:2}.full-controls .right{grid-column:3}.full-controls .pause{grid-column:2;grid-row:3;background:#cbd4ba;font-size:13px}.status{font-size:12px;color:#dfeac5;text-align:center;padding:10px 0 0;min-height:28px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:390px){.toolbar{gap:6px;padding-top:9px}.toolbar button,.toolbar select{padding:8px 7px}.wrap{padding-top:5px}.phone{width:min(350px,96vw)}.phone{padding:24px 22px 28px}.face{padding:14px 10px}.keys{gap:7px 10px}.key{min-height:38px}}@media(min-height:900px){.phone{transform:scale(1.02)}}
</style>
</head>
<body>
<div class="toolbar" aria-label="Spieleinstellungen"><button id="view" aria-pressed="false">▣ Vollbildansicht</button><button id="start">▶ Start / Neustart</button><button id="pause">Ⅱ Pause</button><button id="sound" aria-pressed="true">♪ Ton an</button><label for="level">Tempo <select id="level"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label><label for="walls">Rand <select id="walls"><option value="wrap">Durchgang</option><option value="solid">Wand</option></select></label><label for="maze">Labyrinth <select id="maze"><option value="0">Frei</option><option value="1">Box</option><option value="2">Kreuz</option></select></label></div>
<div class="wrap" id="wrap"><main class="phone" aria-label="Virtuelles Nokia 3310"><div class="speaker"></div><div class="brand">NOKIA</div><section class="face"><div class="screen-shell"><div class="lcd" id="lcd"><canvas id="game" width="312" height="236" role="img" aria-label="Snake II Spielfeld"></canvas></div></div></section><div class="status" id="status" aria-live="polite">Bereit · Drücke Start oder 5</div><div class="keys"><button class="key green" data-act="start" aria-label="Start">☎</button><button class="key" data-act="up" aria-label="Nach oben">▲</button><button class="key red" data-act="pause" aria-label="Pause">✕</button><button class="key" data-act="left" aria-label="Nach links">◀</button><button class="key" data-act="start" aria-label="Start">5</button><button class="key" data-act="right" aria-label="Nach rechts">▶</button><button class="key" data-act="restart" aria-label="Neustart">*</button><button class="key" data-act="down" aria-label="Nach unten">▼</button><button class="key" data-act="sound" aria-label="Ton umschalten">#</button></div></main></div>
<div class="full-controls" id="fullControls"><button class="key up" data-act="up">▲</button><button class="key left" data-act="left">◀</button><button class="key down" data-act="down">▼</button><button class="key right" data-act="right">▶</button><button class="key pause" data-act="pause">Pause</button></div>
<div class="game-version">RETRO EDITION · VERSION 0.3</div><div class="bottom">SNAKE 3310 · Pfeiltasten / WASD oder 2–4–6–8 · Enter/5 startet · Leertaste pausiert · Wischen auf dem Display möglich.<br>Highscore wird nur auf diesem Gerät gespeichert. Fan-Prototyp, nicht von Nokia autorisiert.</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),level=document.getElementById('level'),mazeSelect=document.getElementById('maze');const walls=document.getElementById('walls');const COLS=26,ROWS=17,CELL=12,TOP=32,W=312,H=236;const ink='#293e28',mid='#536c40',paper='#aabd83',light='#b6c991';let snake=[],dir={x:1,y:0},turnQueue=[],food=null,bonus=null,bonusSteps=0,score=0,best=0,phase='ready',obstacles=new Set(),timer=0,soundOn=true,audio=null,beat=0;
try{best=Number(localStorage.getItem('snake3310_best')||0)||0;level.value=localStorage.getItem('snake3310_level')||'3';mazeSelect.value=localStorage.getItem('snake3310_maze')||'0';walls.value=localStorage.getItem('snake3310_walls')||'wrap';soundOn=localStorage.getItem('snake3310_sound')!=='false'}catch(_){}document.getElementById('sound').textContent=soundOn?'♪ Ton an':'♪ Ton aus';document.getElementById('sound').setAttribute('aria-pressed',String(soundOn));
function point(x,y){return `${x},${y}`}function occupied(x,y){return snake.some(s=>s.x===x&&s.y===y)||obstacles.has(point(x,y))}function play(freq=400,dur=.055){if(!soundOn)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
function mazeCells(n){let s=new Set();if(n==='1'){for(let x=6;x<20;x++){s.add(point(x,4));s.add(point(x,12))}for(let y=4;y<=12;y++){s.add(point(6,y));s.add(point(19,y))}for(let x=10;x<=15;x++){s.delete(point(x,4));s.delete(point(x,12))}for(let y=7;y<=9;y++){s.delete(point(6,y));s.delete(point(19,y))}}else if(n==='2'){for(let y=2;y<15;y++){if(y!==7&&y!==8&&y!==9)s.add(point(13,y))}for(let x=3;x<23;x++){if(x!==11&&x!==12&&x!==13&&x!==14&&x!==15)s.add(point(x,8))}}return s}
function randomCell(){const free=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!occupied(x,y)&&(!food||food.x!==x||food.y!==y)&&(!bonus||bonus.x!==x||bonus.y!==y))free.push({x,y});return free.length?free[Math.random()*free.length|0]:null}
function reset(){clearInterval(timer);obstacles=mazeCells(mazeSelect.value);snake=[{x:4,y:8},{x:3,y:8},{x:2,y:8}];if(snake.some(s=>obstacles.has(point(s.x,s.y)))){snake=[{x:1,y:1},{x:0,y:1}]}dir={x:1,y:0};turnQueue=[];score=0;bonus=null;bonusSteps=0;beat=0;food=randomCell();phase='playing';status.textContent='Spielt · Punkte: 0';play(630,.07);timer=setInterval(step,Math.max(73,260-Number(level.value)*21));draw()}
function change(x,y){if(phase==='ready'||phase==='over'){reset()}if(phase!=='playing')return;const base=turnQueue.length?turnQueue[turnQueue.length-1]:dir;if(x===base.x&&y===base.y)return;if(x===-base.x&&y===-base.y)return;if(turnQueue.length>=3)return;turnQueue.push({x,y})}
function togglePause(){if(phase==='ready'||phase==='over'){reset();return}phase=phase==='playing'?'paused':'playing';status.textContent=phase==='paused'?'Pausiert':'Spielt · Punkte: '+score;play(280,.06);draw()}
function step(){if(phase!=='playing')return;beat++;if(turnQueue.length){dir=turnQueue.shift()}const rawX=snake[0].x+dir.x,rawY=snake[0].y+dir.y;if(walls.value==='solid'&&(rawX<0||rawX>=COLS||rawY<0||rawY>=ROWS)){gameOver();return}let head={x:(rawX+COLS)%COLS,y:(rawY+ROWS)%ROWS};const eating=food&&head.x===food.x&&head.y===food.y;const bonusEat=bonus&&head.x===bonus.x&&head.y===bonus.y;const body=eating||bonusEat?snake:snake.slice(0,-1);if(obstacles.has(point(head.x,head.y))||body.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}snake.unshift(head);if(eating){score+=10;food=null;play(690,.055);food=randomCell();if(score>0&&score%50===0&&!bonus){bonus=randomCell();bonusSteps=55}}else if(bonusEat){score+=25;bonus=null;bonusSteps=0;play(870,.11)}else snake.pop();if(bonus){bonusSteps--;if(bonusSteps<=0)bonus=null}if(score>best){best=score;try{localStorage.setItem('snake3310_best',String(best))}catch(_){}}if(!food){phase='over';clearInterval(timer);status.textContent='Gewonnen! · '+score+' Punkte'}else status.textContent='Spielt · Punkte: '+score;draw()}
function gameOver(){phase='over';clearInterval(timer);turnQueue=[];status.textContent='Game Over · '+score+' Punkte · Start für Neustart';play(185,.22);draw()}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0)}function txt(s,x,y,size=12,align='left'){ctx.fillStyle=ink;ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}function cell(x,y,color=ink){const px=x*CELL,py=TOP+y*CELL;rect(px+1,py+1,10,10,color)}function draw(){ctx.imageSmoothingEnabled=false;rect(0,0,W,H,paper);rect(0,0,W,TOP,light);rect(0,TOP-2,W,2,mid);txt('SNAKE II',7,14,12);for(let i=0;i<4;i++)rect(117+i*5,12-i*2,3,3,ink);ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.strokeRect(144.5,4.5,15,8);rect(160,7,2,3,ink);rect(146,6,11,5,ink);txt(''+String(score).padStart(4,'0'),W-7,14,13,'right');txt('HI '+String(best).padStart(4,'0')+'  LV '+level.value,7,27,9);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)rect(x*CELL+5,TOP+y*CELL+5,1,1,'#879b6b');for(const p of obstacles){const [x,y]=p.split(',').map(Number);cell(x,y,mid);rect(x*CELL+3,TOP+y*CELL+3,6,6,ink)}if(food){cell(food.x,food.y);rect(food.x*CELL+4,TOP+food.y*CELL+4,4,4,light)}if(bonus){cell(bonus.x,bonus.y,beat%2?ink:mid);txt('+',bonus.x*CELL+2,TOP+bonus.y*CELL+10,11)}snake.forEach((p,i)=>{cell(p.x,p.y,i===0?ink:mid);if(i===0){const ex=p.x*CELL+4+(dir.x>0?3:dir.x<0?-1:0),ey=TOP+p.y*CELL+4+(dir.y>0?3:dir.y<0?-1:0);rect(ex,ey,2,2,light)}});if(phase!=='playing'){rect(23,76,266,89,paper);ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.strokeRect(24.5,77.5,263,86);let title=phase==='ready'?'SNAKE II':phase==='paused'?'PAUSE':food?'GAME OVER':'GEWONNEN!';txt(title,W/2,111,21,'center');txt(phase==='ready'?'DRUECKE START':phase==='paused'?'WEITER: PAUSE':'NEUSTART: 5 / ENTER',W/2,137,12,'center');if(phase==='over'&&score>=best&&score>0)txt('NEUER REKORD!',W/2,154,9,'center')}}
function act(a){if(a==='up')change(0,-1);if(a==='down')change(0,1);if(a==='left')change(-1,0);if(a==='right')change(1,0);if(a==='start'){if(phase==='paused')togglePause();else reset()}if(a==='restart')reset();if(a==='pause')togglePause();if(a==='sound')toggleSound()}
function toggleSound(){soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'♪ Ton an':'♪ Ton aus';document.getElementById('sound').setAttribute('aria-pressed',String(soundOn));try{localStorage.setItem('snake3310_sound',String(soundOn))}catch(_){}if(soundOn)play(500,.05)}document.querySelectorAll('[data-act]').forEach(b=>{b.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();b.classList.add('pressed');act(b.dataset.act)});for(const event of ['pointerup','pointercancel','pointerleave'])b.addEventListener(event,()=>b.classList.remove('pressed'));b.addEventListener('click',e=>{if(e.detail===0)act(b.dataset.act)})});document.getElementById('start').onclick=reset;document.getElementById('pause').onclick=togglePause;document.getElementById('sound').onclick=toggleSound;document.getElementById('view').onclick=()=>{const on=document.body.classList.toggle('full');document.getElementById('view').textContent=on?'▣ Nokia-Ansicht':'▣ Vollbildansicht';document.getElementById('view').setAttribute('aria-pressed',String(on))};level.addEventListener('change',()=>{try{localStorage.setItem('snake3310_level',level.value)}catch(_){}if(phase==='playing')reset();else draw()});mazeSelect.addEventListener('change',()=>{try{localStorage.setItem('snake3310_maze',mazeSelect.value)}catch(_){}if(phase==='playing')reset();else{obstacles=mazeCells(mazeSelect.value);draw()}});walls.addEventListener('change',()=>{try{localStorage.setItem('snake3310_walls',walls.value)}catch(_){}if(phase==='playing')reset();else draw()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='playing'){phase='paused';turnQueue=[];status.textContent='Automatisch pausiert';draw()}});window.addEventListener('blur',()=>{if(phase==='playing'){phase='paused';turnQueue=[];status.textContent='Automatisch pausiert';draw()}});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();let a=({arrowup:'up',w:'up','2':'up',arrowdown:'down',s:'down','8':'down',arrowleft:'left',a:'left','4':'left',arrowright:'right',d:'right','6':'right',' ':'pause',enter:'start','5':'start',escape:'pause'})[k];if(a){if(['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;e.preventDefault();if(e.repeat)return;act(a)}});
let touch=null;const lcd=document.getElementById('lcd');lcd.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};lcd.setPointerCapture(e.pointerId)});lcd.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18){if(phase==='ready'||phase==='over')reset();else if(phase==='paused')togglePause();return}if(Math.abs(dx)>Math.abs(dy))change(Math.sign(dx),0);else change(0,Math.sign(dy))});obstacles=mazeCells(mazeSelect.value);snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];food={x:17,y:8};draw();
})();
</script>
</body></html>
